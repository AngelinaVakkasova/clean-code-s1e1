<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" >
  </head>
  <body>
    <header class="hero">
      <div class="aaa">
        <img src="./eisenhower-matrix.jpg" alt="Матрица Эйзенхауэра: важное/срочное">
        <a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
      </div>
    </header>
    <main class="centered-main-page-element">
      <section aria-labelledby="add-item-title">
        <h1 id="topSectionForAddingElementToList">Add Item</h1>
        <form class="task-row-wrapper" action="#" method="post">
          <label for="new-task" class="visually-hidden">Add Item</label>
          <input id="new-task" class="task" type="text" name="task" />
          <button type="submit">Add</button>
        </form>
      </section>
      <section aria-labelledby="todo-title">
        <h2 id="todo-title">Todo</h2>
        <ul id="incompleteTasks">
          <li>
            <input id="task-1" type="checkbox" />
            <label for="task-1" class="task">Pay Bills</label>
            <input type="text" class="task" aria-label="Редактировать: Pay Bills" />
            <button class="edit" type="button">Edit</button>
            <button class="delete" type="button" aria-label="Удалить задачу «Pay Bills»">
              <img src="./remove.svg" alt="" />
            </button>
          </li>
          <li class="editMode">
            <input id="task-2" type="checkbox" />
            <label for="task-2" class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task" aria-label="Редактировать: Go Shopping"/>
            <button class="edit" type="button">Save</button>
            <button class="delete" type="button" aria-label="Удалить задачу «Go Shopping»">
              <img src="./remove.svg" alt=""/>
            </button>
          </li>
        </ul>
      </section>
      <section aria-labelledby="completed-title">
        <h2 id="completed-title">Completed</h2>
        <ul id="completed-tasks">
          <li>
            <input id="task-3" type="checkbox" checked />
            <label for="task-3" class="task">See the Doctor</label>
            <input type="text" class="task" aria-label="Редактировать: See the Doctor" />
            <button class="edit" type="button">Edit</button>
            <button class="delete" type="button" aria-label="Удалить задачу «See the Doctor»">
              <img src="./remove.svg" alt="" />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
